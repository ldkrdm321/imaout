<!doctype html>

<html
    lang="{{ page.lang | default: 'en' }}"
    {% if page.lang == "ar" %}dir="rtl"{% else %}dir="ltr"{% endif %}
>

<head>
    <meta charset="utf-8">

    <link
        rel="icon"
        type="image/png"
        href="{{ '/images/favicon.png' | relative_url }}"
    >

    <link
        rel="apple-touch-icon"
        href="{{ '/images/favicon.png' | relative_url }}"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% if page.title %}
            {{ page.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    {% if page.description %}
        <meta
            name="description"
            content="{{ page.description }}"
        >
    {% endif %}


    <!-- Open Graph / link preview -->

    <meta
        property="og:title"
        content="{{ page.title | default: site.title }}"
    >

    <meta
        property="og:description"
        content="{{ page.description | default: site.description }}"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="{{ page.url | absolute_url }}"
    >

    <meta
        property="og:image"
        content="{{ '/images/imaoutthumbnail.jpg' | absolute_url }}"
    >

    <meta
        property="og:image:width"
        content="1200"
    >

    <meta
        property="og:image:height"
        content="630"
    >

    <meta
        property="og:site_name"
        content="IMA OUT"
    >


    <!-- X / Twitter -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="{{ page.title | default: site.title }}"
    >

    <meta
        name="twitter:description"
        content="{{ page.description | default: site.description }}"
    >

    <meta
        name="twitter:image"
        content="{{ '/images/imaoutthumbnail.jpg' | absolute_url }}"
    >


    <link
        rel="stylesheet"
        href="{{ '/style.css' | relative_url }}"
    >

    {% include language-alternates.html %}

</head>

<body>

    {% include language-switcher.html %}

    {% include breadcrumbs.html %}

    {{ content }}

    {% include campaign-footer.html %}

    <script src="{{ '/js/typing.js' | relative_url }}"></script>

</body>

</html>
